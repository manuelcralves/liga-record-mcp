# proprio modelo de 1,49 por jogador.
#
# TRANSFERENCIA DA JORNADA 7, 18 de setembro: saiu o Nehuen Perez (FC Porto,
# 1,90M), entrou o Lagerbielke (Sp. Braga, 1,55M). Foi a que o modelo
# aconselhava, cerca de +3 pontos ate ao fim da epoca: pouco, mas positivo, e a
# transferencia nao acumula. O Nehuen jogava 24% das jornadas; o Lagerbielke
# joga 90%, e o Braga tem dois defesas lesionados. Ficam 0,35M de folga.
#
# Lido do site a 8 de setembro e conferido: quota 3-8-8-4, 40,00M de 40,00M.

