# The sheet as entered on the site, for the round named above.
#
# THIS IS THE ONE PLACE IT LIVES. It sat in build_dashboard.py as three lists
# of bare ids, which meant changing a team sheet meant editing a Python file
# and the page silently kept showing last week's eleven until somebody
# remembered. Here it is data, the loader validates it against §6.13 and §6.15
# before anything is drawn, and an illegal formation is a refusal rather than a
# page that looks fine.
#
# `bench` order matters: §11.2 works down it when it substitutes.
#
# Read back from the site by hand, because reading a team sheet needs a login
# this project deliberately does not hold — the server advises, Manuel clicks.
# Entregue no site para a jornada 4 e CONFERIDA lá pelo Manuel a 26/08/2026.
# A folha do site não se pode ler daqui — precisa de sessão iniciada, que este
# projeto não tem de propósito — por isso a confirmação é dele e fica dita.
