# Os treinadores que o site oferece (§6.15), um por clube — DEZASSETE a 09/11,
# porque um clube esta sem ninguem em funcoes. Nao sao sempre dezoito.
#
# Read from the logged-in team-sheet page on 2026-08-19, during Ronda 3.
#
# Why this is a file rather than a live fetch: the coach list is only rendered
# for a signed-in user, and the three endpoints that touch it are all POST
# setters — team_manager.ashx sets your coach, it does not list them. So this
# is hand-maintained like data/squad.yaml, which is fine: the list changes only
# when a club changes manager.
#
# §6.17 — a round with no coach selected scores zero. That is why the server
# checks a chosen coach against this list rather than accepting any text.
#
# Coaches are free: they never cost budget (§6.15).

# ATUALIZADO A 27/10/2026, da lista da propria pagina da equipa, que passou a
# ter DEZASSEIS e nao dezoito. O Estoril e o Famalicao ficaram sem treinador em
# funcoes e saem daqui: o §6.15 escolhe-se de entre os que o site oferece, e o
# §14.5 nao paga nada a quem nao pode ir ao banco — o email da jornada 9 omite
# tres clubes (Estoril, Famalicao e Nacional, que nessa semana ainda estava sem
# ninguem) em vez de lhes dar zero. Sem treinador na lista ficam dois. O Nacional despediu o
# Alexandre Santos e tem agora o Joao Henriques; o Sp. Braga trocou o Carlos
# Vicens pelo Franclim Carvalho.
#
# E OS IDS SAO OS VERDADEIROS. Vinham dos nomes dos ficheiros das fotografias
# na lista do site (m<id>.jpg), o que acabou com os marcadores que estavam aqui
# desde 23/09 — Arouca 909, Rio Ave 777, Nacional 787, Sp. Braga 834.

# ATUALIZADO A 09/11/2026, outra vez da lista da propria pagina da equipa, com
# os ids tirados dos nomes das fotografias (m<id>.jpg) como da ultima vez. Sao
# DEZASSETE: o Sporting passou a ter o Paulo Fonseca (206) no lugar do Rui
# Borges (860), e o ESTORIL JA TEM TREINADOR, o Sergio Raimundo (910). So o
# Famalicao continua sem ninguem.
#
# PORQUE E QUE ISTO FOI PRECISO. A folha da jornada 11 aconselhou o Rui Borges,
# que ja nao estava no cargo, e a recomendacao nao se podia cumprir. O clube
# estava certo — o Sporting jogava em casa e o Paulo Fonseca fez 5 — mas a
# pessoa nao existia. Foi escolhido o Marco Silva, que fez 4: um ponto perdido
# por este ficheiro estar velho.
#
# OS PONTOS NAO FORAM REFRESCADOS. Continuam a copia a mao das datas anteriores,
# e os dois novos ficam a zero. Nao entram no ranking, que corre sobre o jogo do
# clube (coaches.rank_coaches) e nao sobre esta coluna.

