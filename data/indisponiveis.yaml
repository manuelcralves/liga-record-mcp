# Quem não joga esta jornada, e porquê.
#
# A ÚNICA COISA QUE QUEM GERE A EQUIPA SABE E O MODELO NÃO. O modelo conta cartões, por
# isso vê as suspensões sozinho. Lesões não: o site não as publica — o payload
# de um jogador tem quinze campos e nenhum é disponibilidade — e este projeto
# não lê a imprensa. Portanto vem daqui, à mão, como o plantel e os treinadores.
#
# VALE MAIS QUE AS TRANSFERÊNCIAS. Medido a jogar uma época inteira do princípio
# com o plantel do Melro: escolher o onze às cegas dá 1246 pontos; saber quem
# está fora dá 1306; acrescentar as transferências por cima dá 1326. Os sessenta
# pontos de saber quem está lesionado são o triplo do que rende o canal das
# transferências inteiro.
#
# COMO FUNCIONA. Um jogador aqui é ordenado abaixo de todos os aptos, não
# apagado — assim um plantel com os três guarda-redes fora ainda consegue
# apresentar um onze legal em vez de recusar.
#
# A JORNADA IMPORTA. Isto aplica-se à jornada nomeada abaixo e a mais nenhuma.
# Uma lesão sabida antes do apito entra na projeção registada, que é o modelo do
# dia a estar certo; escrever aqui depois do jogo seria julgar o passado com
# informação que não existia, e o `record_projection` recusa-se a registar uma
# jornada já começada precisamente por isso.
#
# Esvazia a lista quando a jornada mudar.

jornada: 8

# VAZIA A 23/09, E ISSO NÃO QUER DIZER QUE ESTEJAM TODOS APTOS. Quer dizer que
# o boletim clínico da jornada 8 ainda não foi lido: o último em data/boletim/
# é o de 18/09, que é da jornada 7. Enquanto isto estiver vazio, o modelo
# projeta a jornada 8 com o plantel todo apto — que era exatamente o que já
# acontecia com `jornada: 7` escrito aqui, porque o `load_unavailable` devolve
# vazio quando a jornada não bate certo. A diferença é que agora está dito.
#
# ANTES DO FECHO, SEXTA 9/10 ÀS 18:30: copiar o boletim para data/boletim/, pôr
# aqui quem ele listar do plantel, e reconstruir as páginas. Mexer nesta lista
# obriga o ledger a registar a jornada de novo, que é o que se quer — a jornada
# 8 está registada desde 21/09 com esta lista vazia.
#
# O ZAIDU É O NOME A CONFIRMAR PRIMEIRO. A paragem dele eram dois meses desde a
# jornada 4 e «só volta depois da pausa internacional»; a jornada 8 joga-se de 9
# a 12 de outubro, já depois da pausa. Pode estar apto, pode não estar, e é o
# boletim que decide — não esta nota.

fora: []

