# The ledger, written by a machine that is never switched off.
#
# WHY THIS EXISTS. The scheduled task on Manuel's PC does the same two steps,
# and does them well — but only while the PC is on and he is logged in. Almost
# every step of the routine survives being missed, because it recomputes from
# whatever is true when it next runs. One does not: `record` stores what the
# model expected BEFORE a round kicks off, and refuses afterwards, on purpose.
# A prediction written after the result is worthless. So a week away from the
# machine does not make the pages stale — it puts a permanent hole in the only
# evidence that says whether the model is worth believing.
#
# WHAT IT DELIBERATELY DOES NOT DO. It does not build pages. The private build
# reads LIGA_RECORD_LEAGUE, whose guid grants read access to twenty-nine other
# people's results, and that guid is not going into a CI secret to save a page
# that is only ever read on one laptop. The two steps here need nothing but the
# public market and the squad file, so this job holds no secret at all — and a
# job with no secret cannot leak one.
#
# GitHub disables scheduled workflows in a repository that has seen no activity
# for sixty days. If the ledger ever goes quiet for a season, that is the first
# thing to check.

name: Registar previsões

on:
  # UTC, always. In Lisbon summer that is 08:00 and 17:00; in winter, 07:00 and
  # 16:00. Between them they land before both the Saturday afternoon kickoffs
  # and the Friday and Saturday evening ones. GitHub runs scheduled jobs late
  # when it is busy, and occasionally not at all, which is the other reason
  # there are two: recording refuses once a round is already on file, so the
  # second run of a day costs nothing on the days the first one worked.
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

# Only what it needs: a commit of one file to this repository.
permissions:
  contents: write

# Two runs must never write the ledger at once.
concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      # Kept current on purpose. Both of these were on v4/v5, targeting a Node
      # that GitHub had already deprecated and was force-running on a newer one
      # — which works right up until it does not. A scheduled job nobody watches
      # is the worst place to discover an action has stopped being supported.
      - uses: actions/checkout@v7
        with:
          # The whole history, not the single commit checkout takes by default.
          # The last step rebases before pushing, and a rebase on a shallow
          # clone fails in ways that read like a corrupt repository. This one is
          # ninety-nine files; the full clone costs nothing worth saving.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -e .

      # --only, rather than calling the scripts directly, so the phrases that
      # mean "declined on purpose" live in exactly one place. A second copy
      # here would drift, and the drift would show up as a red job for a step
      # that did precisely what it was designed to do.
      - name: Registar e liquidar
        run: python scripts/routine.py --only registar liquidar

      - name: Guardar o que mudou
        run: |
          set -euo pipefail

          # The guard, and it is the point of this step. The job is only ever
          # allowed to have touched the ledger. If anything else is dirty,
          # something happened that nobody designed, and the answer is to stop
          # and say so rather than to push it.
          changed="$(git diff --name-only)"
          unexpected="$(echo "$changed" | grep -v '^data/projections\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::este trabalho só pode mexer no ledger, e mexeu em:"
            echo "$unexpected"
            exit 1
          fi

          if [ -z "$changed" ]; then
            echo "nada a registar — a ronda já estava em ficheiro"
            exit 0
          fi

          # WHAT ACTUALLY HAPPENED, read off the diff rather than assumed. The
          # message here was fixed prose — "registado antes do apito" — and the
          # job says that whether it recorded a prediction or filled in a result
          # afterwards. It settled six players and claimed to have predicted
          # them, which in a file whose whole purpose is keeping those two
          # apart is the one lie it must not tell.
          #
          # The diff is the honest source: a new round brings a recorded_at, and
          # a settled player turns "actual": null into a number.
          diff="$(git diff -U0 -- data/projections.json)"
          recorded=$(printf '%s\n' "$diff" | grep -c '^+.*"recorded_at"' || true)
          settled=$(printf '%s\n' "$diff" | grep -c '^+.*"actual": [^n]' || true)

          if [ "$recorded" -gt 0 ] && [ "$settled" -gt 0 ]; then
            subject="chore: uma ronda registada, e $settled jogadores liquidados"
          elif [ "$recorded" -gt 0 ]; then
            subject="chore: a previsão da ronda, registada antes do apito"
          elif [ "$settled" -gt 0 ]; then
            subject="chore: $settled jogadores liquidados contra o que foi previsto"
          else
            subject="chore: o ledger, atualizado pelo trabalho agendado"
          fi
          echo "::notice::$subject"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/projections.json
          git commit -m "$subject" -m "Trabalho agendado. Registar recusa depois do apito, e liquidar só preenche clubes que já jogaram — o que este commit contém é o que o regulamento deixou fazer no momento em que correu."

          # He commits from the laptop too. Rebasing one file's commit onto
          # whatever he pushed meanwhile is almost always clean; when it is
          # not, failing is correct — a ledger silently resolved by a machine
          # is worse than one that needs a minute of attention.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # THE ONE DEADLINE WITH NO SECOND CHANCE, and the only channel that
      # actually reaches him.
      #
      # Miss a team sheet and a round is lost. Miss matchday 5 and the squad is
      # fixed for the season, the top-scorer bet with it, and unlimited
      # transfers become one a round — measured, the gap between a good squad
      # and a careless one runs to several hundred points.
      #
      # It is also the one nobody can plan around: Record had published no date
      # for matchday 5 as late as 26 August, four days after matchday 3 was
      # played. It appears when it appears.
      #
      # A step that PRINTS the warning changes nothing — the log is a page
      # nobody opens. A step that FAILS sends an email, which is the only push
      # this repository has. So this deliberately fails while the deadline is
      # inside a week, and it sits last so the ledger is already committed and
      # pushed by the time it does: the red tick means "act", never "the job
      # broke".
      #
      # `if: always()` because the whole point is that it runs on the day
      # something above it went wrong too.
      - name: Avisar do prazo que fecha tudo
        if: always()
        run: python scripts/pending_decisions.py --alerta 7
